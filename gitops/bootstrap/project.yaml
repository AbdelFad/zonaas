apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zonaas
  namespace: argocd
spec:
  description: ML Landing Zone Project (locked-down)
  sourceRepos:
    - 'https://github.com/example/ml-projects-catalog.git'
    - 'https://github.com/example/*-prod.git'
  destinations:
    - namespace: ml-*
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: zonaas-admin
      description: admin role for platform team
      policies:
        - p, proj:zonaas:zonaas-admin, applications, *, zonaas/*, allow
