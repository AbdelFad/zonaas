name: validate

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt
        run: terraform -chdir=terraform/environments/dev fmt -check -recursive

      - name: Terraform validate (syntax only)
        run: |
          terraform -chdir=terraform/environments/dev init -backend=false
          terraform -chdir=terraform/environments/dev validate

      - name: Kustomize build bootstrap
        run: kubectl kustomize gitops/bootstrap >/dev/null

      - name: Kustomize build policies
        run: kubectl kustomize policies/kyverno >/dev/null
